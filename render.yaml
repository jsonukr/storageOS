# Render Blueprint for the StorageOS relay.
# Docs: https://render.com/docs/blueprint-spec
#
# To use: Render dashboard → New + → Blueprint → connect jsonukr/storageOS → Apply.
# Render reads this file and provisions the service below automatically.
#
# NOTE: the relay reads --port from the CLI (NOT the $PORT env var), so the
# startCommand must pass --port $PORT or Render will kill it for not binding.
services:
  # Service name = onrender.com subdomain. Named "storageos" so it maps to
  # the existing wss://storageos.onrender.com/ws that every shipped app has
  # hardcoded — keeping the URL means no client rebuild is needed.
  - type: web
    name: storageos
    runtime: rust
    plan: free
    branch: dev
    rootDir: services/storageos-relay
    buildCommand: cargo build --release
    startCommand: ./target/release/storageos-relay --port $PORT --bind 0.0.0.0
    healthCheckPath: /health

[package]
name = "storageos-relay"
version = "0.1.0"
edition = "2021"
description = "StorageOS Relay Server — routes protocol messages between agents"

[[bin]]
name = "storageos-relay"
path = "src/main.rs"

[dependencies]
storageos-core = { path = "../../crates/storageos-core" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
